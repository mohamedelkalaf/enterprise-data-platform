services:
  edp-postgres:
    image: postgres:15
    container_name: edp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: edp_password_2026
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./sql:/sql

  minio:
    image: bitnamilegacy/minio:latest
    container_name: edp_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: edp_password_2026
    volumes:
      - ./docker-data/minio:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: edp_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: edp_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  superset:
    image: apache/superset:latest
    container_name: edp_superset
    restart: unless-stopped
    ports:
      - "8088:8088"

    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      PYTHONPATH: /app/pythonpath

    volumes:
      - type: bind
        source: E:/Projects/EnterpriseDataPlatform/superset_config.py
        target: /app/pythonpath/superset_config.py
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: E:/Projects/EnterpriseDataPlatform/docker-data/superset
        target: /app/superset_home
        bind:
          create_host_path: false

  airflow:
    image: apache/airflow:2.9.1-python3.10
    container_name: edp_airflow
    restart: unless-stopped
    depends_on:
      - edp-postgres
      - minio
    ports:
      - "8085:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:edp_password_2026@edp_postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - _PIP_ADDITIONAL_REQUIREMENTS=minio psycopg2-binary reportlab
      - MINIO_ENDPOINT=edp_minio:9000
      - PG_HOST=edp_postgres
      - PG_PORT=5432
      - REPORTS_DIR=/opt/airflow/reports_output
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipelines:/opt/airflow/pipelines
      - ./reports_output:/opt/airflow/reports_output
      - ./docker-data/airflow_logs:/opt/airflow/logs
    command: bash -c "airflow db migrate && airflow users create --username admin --firstname Mohamed --lastname Elkalaf --role Admin --email admin@edp.com --password admin || true && (airflow scheduler &) && airflow webserver"
